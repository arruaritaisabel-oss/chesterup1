[build]
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

# SPA fallback (no es estrictamente necesario aquí porque la app no usa rutas,
# pero lo dejamos por si en el futuro agregás react-router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad razonables.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
